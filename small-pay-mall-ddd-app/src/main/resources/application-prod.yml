server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://mysql:3306/s_pay_mall?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource

weixin:
  config:
    originalid: ${WEIXIN_ORIGINALID}
    token: ${WEIXIN_TOKEN}
    app-id: ${WEIXIN_APP_ID}
    app-secret: ${WEIXIN_APP_SECRET}
    template_id: ${WEIXIN_TEMPLATE_ID}

# 支付宝支付 - 沙箱 https://opendocs.alipay.com/common/02kkv7
alipay:
  config:
    enabled: true
    app_id: ${ALIPAY_APP_ID}
    merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY}
    alipay_public_key: ${ALIPAY_PUBLIC_KEY}
    gateway_url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    sign_type: RSA2
    notify_url: http://cjz.nat100.top/api/v1/alipay/alipay_notify_url
    return_url: https://gaga.plus


# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml